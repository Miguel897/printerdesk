# Build and test on every push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer reads the version from the latest tag

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # CI=true makes restore use the committed packages.lock.json files (locked mode).
      - name: Test
        run: dotnet test PrinterDesk.slnx -c Release
