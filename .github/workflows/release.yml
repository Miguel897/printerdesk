# Push a tag like v0.3.0 to build, test and publish PrinterDesk.exe as a GitHub Release.
# The release notes are that version's section of CHANGELOG.md; the run fails if it is missing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer reads the version from the tag

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no '## [$version]' section." }
          $next = ($lines[$start..($lines.Count - 1)] | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $end = if ($next) { $start + $next - 2 } else { $lines.Count - 1 }
          ($lines[$start..$end] -join "`n").Trim() | Set-Content release-notes.md
          Get-Content release-notes.md

      - name: Test
        run: dotnet test PrinterDesk.slnx -c Release

      - name: Publish single-file exe
        shell: pwsh
        run: |
          dotnet publish src/PrinterDesk.App -c Release -r win-x64 -o publish
          $version = "${{ github.ref_name }}".TrimStart("v")
          $actual = (Get-Item publish/PrinterDesk.exe).VersionInfo.ProductVersion
          if (-not $actual.StartsWith("$version+") -and $actual -ne $version) { throw "Exe version $actual does not match tag $version." }

      # Third-party action with write access: pinned to a commit; Dependabot updates it.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: publish/PrinterDesk.exe
          body_path: release-notes.md
